# Netlify configuration for Mack Mountain Properties
# Static site — no build step. Netlify serves these files directly.

[build]
  publish = "."
  command = ""

# Nice-to-have security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
